<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>친구 ON 로그인</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    input {
      padding: 12px;
      font-size: 16px;
      width: 280px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>친구 ON 로그인</h2>
  <input type="email" id="email" placeholder="이메일을 입력하세요">
  <button onclick="sendMagicLink()">로그인 링크 받기</button>

  <script>
    // ↓↓↓ 여기 두 줄만 본인 정보로 바꾸세요 ↓↓↓
    const SUPABASE_URL = 'https://mrqdauxhfnqeulgynyzc.supabase.co'
    const SUPABASE_KEY = 'sb_publishable_L0Do3jh1SCjxInDEy3EGEw_AbT-4CMT'

    const { createClient } = supabase
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY)

    async function sendMagicLink() {
      const email = document.getElementById('email').value.trim()

      if (!email) {
        alert('이메일을 입력해주세요')
        return
      }

      const { error } = await supabaseClient.auth.signInWithOtp({
        email: email
      })

      if (error) {
        alert('오류 발생: ' + error.message)
      } else {
        alert('로그인 링크를 이메일로 보냈습니다!\n이메일을 확인해주세요.')
      }
    }
  </script>
</body>
</html>
